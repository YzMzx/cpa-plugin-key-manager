name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Existing release tag to build (required when dispatched from a branch)"
        required: false
        type: string

permissions:
  contents: read

jobs:
  resolve:
    name: Resolve immutable release inputs
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      plugin_sha: ${{ steps.release.outputs.plugin_sha }}
      host_sha: ${{ steps.release.outputs.host_sha }}
    steps:
      - name: Checkout release refs
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate tag, source version and pinned host
        id: release
        shell: bash
        env:
          INPUT_TAG: ${{ github.event.inputs.tag_name }}
        run: |
          set -euo pipefail
          TAG="${INPUT_TAG}"
          if [ -z "$TAG" ]; then
            if [ "$GITHUB_REF_TYPE" != "tag" ]; then
              echo "An existing tag_name is required for a branch dispatch" >&2
              exit 1
            fi
            TAG="$GITHUB_REF_NAME"
          fi
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z][0-9A-Za-z.-]*)?$ ]]; then
            echo "Invalid release tag" >&2
            exit 1
          fi
          git show-ref --verify --quiet "refs/tags/$TAG" || { echo "Release tag does not exist" >&2; exit 1; }
          PLUGIN_SHA="$(git rev-parse --verify "refs/tags/$TAG^{commit}")"
          VERSION="$(git show "$PLUGIN_SHA:internal/plugin/plugin.go" | sed -nE 's/^[[:space:]]*PluginVersion[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p')"
          if [ "$TAG" != "v$VERSION" ]; then
            echo "Release tag does not match PluginVersion" >&2
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "plugin_sha=$PLUGIN_SHA" >> "$GITHUB_OUTPUT"
          echo "host_sha=681ce41b6e44c45b15b79378b003909d6ba29e68" >> "$GITHUB_OUTPUT"
          printf 'Release tag: %s\nPlugin SHA: %s\nPinned host SHA: %s\n' "$TAG" "$PLUGIN_SHA" "681ce41b6e44c45b15b79378b003909d6ba29e68"

  test:
    name: Unit Tests
    needs: resolve
    runs-on: ubuntu-latest
    steps:
      - name: Checkout cpa-plugin-key-manager
        uses: actions/checkout@v4
        with:
          path: cpa-plugin-key-manager
          ref: ${{ needs.resolve.outputs.plugin_sha }}
          persist-credentials: false

      - name: Checkout pinned CLIProxyAPI host repository
        uses: actions/checkout@v4
        with:
          repository: router-for-me/CLIProxyAPI
          ref: ${{ needs.resolve.outputs.host_sha }}
          path: CLIProxyAPI
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: CLIProxyAPI/go.mod
          cache: true
          cache-dependency-path: cpa-plugin-key-manager/go.sum

      - name: Run unit tests with race detector
        working-directory: cpa-plugin-key-manager
        env:
          CGO_ENABLED: "1"
        run: go test -v -race ./...

      - name: Run static analysis
        working-directory: cpa-plugin-key-manager
        run: go vet ./...

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Run frontend regressions
        working-directory: cpa-plugin-key-manager
        run: node --test web/auth.test.cjs web/settings.test.cjs web/runtime.test.cjs web/audit.test.cjs

  build:
    name: Build (${{ matrix.target }})
    needs: [resolve, test]
    runs-on: ${{ matrix.os }}
    # macOS arm64 runners are frequently queued for a long time; without an
    # explicit budget GitHub cancels the job while it is still waiting.
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-amd64
            os: ubuntu-latest
            goos: linux
            goarch: amd64
            ext: so
            archive: tar.gz
            cc: gcc
          - target: linux-arm64
            os: ubuntu-latest
            goos: linux
            goarch: arm64
            ext: so
            archive: tar.gz
            cc: aarch64-linux-gnu-gcc
          - target: windows-amd64
            os: windows-latest
            goos: windows
            goarch: amd64
            ext: dll
            archive: zip
            cc: gcc
          - target: darwin-arm64
            os: macos-latest
            goos: darwin
            goarch: arm64
            ext: dylib
            archive: tar.gz
            cc: clang
            cgo_flags: "-arch arm64"
          - target: darwin-amd64
            os: macos-latest
            goos: darwin
            goarch: amd64
            ext: dylib
            archive: tar.gz
            cc: clang
            cgo_flags: "-arch x86_64"

    steps:
      - name: Checkout cpa-plugin-key-manager
        uses: actions/checkout@v4
        with:
          path: cpa-plugin-key-manager
          ref: ${{ needs.resolve.outputs.plugin_sha }}
          persist-credentials: false

      - name: Checkout pinned CLIProxyAPI host repository
        uses: actions/checkout@v4
        with:
          repository: router-for-me/CLIProxyAPI
          ref: ${{ needs.resolve.outputs.host_sha }}
          path: CLIProxyAPI
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: CLIProxyAPI/go.mod
          cache: true
          cache-dependency-path: cpa-plugin-key-manager/go.sum

      - name: Install ARM64 cross-compiler (Linux ARM64)
        if: matrix.target == 'linux-arm64'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu libc6-dev-arm64-cross

      - name: Build c-shared plugin binary & package archive
        working-directory: cpa-plugin-key-manager
        shell: bash
        env:
          CGO_ENABLED: "1"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CC: ${{ matrix.cc }}
          CGO_CFLAGS: ${{ matrix.cgo_flags }}
          CGO_LDFLAGS: ${{ matrix.cgo_flags }}
        run: |
          set -euo pipefail
          mkdir -p dist/stage dist/out

          RAW_LIB="cpa-plugin-key-manager-${{ matrix.target }}.${{ matrix.ext }}"
          STD_LIB="cpa-plugin-key-manager.${{ matrix.ext }}"

          go build -trimpath -ldflags="-s -w" -buildmode=c-shared -o "dist/out/${RAW_LIB}" .
          rm -f "dist/out/cpa-plugin-key-manager-${{ matrix.target }}.h"

          cp "dist/out/${RAW_LIB}" "dist/stage/${STD_LIB}"
          cp config.example.yaml README.md install.sh install.ps1 dist/stage/
          cp -R integrations dist/stage/

          if [ "${{ matrix.archive }}" = "zip" ]; then
            (cd dist/stage && 7z a -tzip "../out/cpa-plugin-key-manager-${{ matrix.target }}.zip" "${STD_LIB}" config.example.yaml README.md install.sh install.ps1 integrations)
          else
            tar -C dist/stage -czvf "dist/out/cpa-plugin-key-manager-${{ matrix.target }}.tar.gz" "${STD_LIB}" config.example.yaml README.md install.sh install.ps1 integrations
          fi

          ls -lh dist/out/

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.target }}
          path: cpa-plugin-key-manager/dist/out/*
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: [resolve, build]
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Download all platform artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Generate SHA256SUMS.txt
        working-directory: artifacts
        run: |
          shasum -a 256 cpa-plugin-key-manager-* > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.resolve.outputs.tag }}
          name: "Release ${{ needs.resolve.outputs.tag }}"
          generate_release_notes: true
          prerelease: ${{ contains(needs.resolve.outputs.tag, '-') }}
          files: |
            artifacts/cpa-plugin-key-manager-*
            artifacts/SHA256SUMS.txt
