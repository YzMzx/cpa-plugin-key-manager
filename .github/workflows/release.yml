name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Optional tag name for manual release (e.g. v0.1.0)"
        required: false
        type: string

permissions:
  contents: write

jobs:
  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout cpa-plugin-key-manager
        uses: actions/checkout@v4
        with:
          path: cpa-plugin-key-manager

      - name: Checkout CLIProxyAPI host repository
        shell: bash
        run: |
          if git clone --depth 1 https://github.com/YzMzx/CLIProxyAPI.git CLIProxyAPI; then
            echo "Cloned YzMzx/CLIProxyAPI"
          else
            echo "Falling back to router-for-me/CLIProxyAPI"
            git clone --depth 1 https://github.com/router-for-me/CLIProxyAPI.git CLIProxyAPI
          fi

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: CLIProxyAPI/go.mod
          cache: true
          cache-dependency-path: cpa-plugin-key-manager/go.sum

      - name: Run unit tests with race detector
        working-directory: cpa-plugin-key-manager
        env:
          CGO_ENABLED: "1"
        run: go test -v -race ./...

  build:
    name: Build (${{ matrix.target }})
    needs: test
    runs-on: ${{ matrix.os }}
    # macOS arm64 runners are frequently queued for a long time; without an
    # explicit budget GitHub cancels the job while it is still waiting.
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-amd64
            os: ubuntu-latest
            goos: linux
            goarch: amd64
            ext: so
            archive: tar.gz
            cc: gcc
          - target: linux-arm64
            os: ubuntu-latest
            goos: linux
            goarch: arm64
            ext: so
            archive: tar.gz
            cc: aarch64-linux-gnu-gcc
          - target: windows-amd64
            os: windows-latest
            goos: windows
            goarch: amd64
            ext: dll
            archive: zip
            cc: gcc
          - target: darwin-arm64
            os: macos-latest
            goos: darwin
            goarch: arm64
            ext: dylib
            archive: tar.gz
            cc: clang
            cgo_flags: "-arch arm64"
          - target: darwin-amd64
            os: macos-latest
            goos: darwin
            goarch: amd64
            ext: dylib
            archive: tar.gz
            cc: clang
            cgo_flags: "-arch x86_64"

    steps:
      - name: Checkout cpa-plugin-key-manager
        uses: actions/checkout@v4
        with:
          path: cpa-plugin-key-manager

      - name: Checkout CLIProxyAPI host repository
        shell: bash
        run: |
          if git clone --depth 1 https://github.com/YzMzx/CLIProxyAPI.git CLIProxyAPI; then
            echo "Cloned YzMzx/CLIProxyAPI"
          else
            echo "Falling back to router-for-me/CLIProxyAPI"
            git clone --depth 1 https://github.com/router-for-me/CLIProxyAPI.git CLIProxyAPI
          fi

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: CLIProxyAPI/go.mod
          cache: true
          cache-dependency-path: cpa-plugin-key-manager/go.sum

      - name: Install ARM64 cross-compiler (Linux ARM64)
        if: matrix.target == 'linux-arm64'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu libc6-dev-arm64-cross

      - name: Build c-shared plugin binary & package archive
        working-directory: cpa-plugin-key-manager
        shell: bash
        env:
          CGO_ENABLED: "1"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CC: ${{ matrix.cc }}
          CGO_CFLAGS: ${{ matrix.cgo_flags }}
          CGO_LDFLAGS: ${{ matrix.cgo_flags }}
        run: |
          set -euo pipefail
          mkdir -p dist/stage dist/out

          RAW_LIB="cpa-plugin-key-manager-${{ matrix.target }}.${{ matrix.ext }}"
          STD_LIB="cpa-plugin-key-manager.${{ matrix.ext }}"

          go build -trimpath -ldflags="-s -w" -buildmode=c-shared -o "dist/out/${RAW_LIB}" .
          rm -f "dist/out/cpa-plugin-key-manager-${{ matrix.target }}.h"

          cp "dist/out/${RAW_LIB}" "dist/stage/${STD_LIB}"
          cp config.example.yaml README.md install.sh install.ps1 dist/stage/

          if [ "${{ matrix.archive }}" = "zip" ]; then
            (cd dist/stage && 7z a -tzip "../out/cpa-plugin-key-manager-${{ matrix.target }}.zip" "${STD_LIB}" config.example.yaml README.md install.sh install.ps1)
          else
            tar -C dist/stage -czvf "dist/out/cpa-plugin-key-manager-${{ matrix.target }}.tar.gz" "${STD_LIB}" config.example.yaml README.md install.sh install.ps1
          fi

          ls -lh dist/out/

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.target }}
          path: cpa-plugin-key-manager/dist/out/*
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') || github.event.inputs.tag_name != ''
    runs-on: ubuntu-latest
    steps:
      - name: Download all platform artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Generate SHA256SUMS.txt
        working-directory: artifacts
        run: |
          shasum -a 256 cpa-plugin-key-manager-* > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag_name || github.ref_name }}
          name: "Release ${{ github.event.inputs.tag_name || github.ref_name }}"
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            artifacts/cpa-plugin-key-manager-*
            artifacts/SHA256SUMS.txt
