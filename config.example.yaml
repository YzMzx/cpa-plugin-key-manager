# =============================================================================
# CLIProxyAPI - cpa-plugin-key 插件完整配置示例
# 将以下 plugins 配置块合入 CLIProxyAPI 的主配置文件 config.yaml 即可启用
# =============================================================================

plugins:
  enabled: true
  dir: ./plugins
  configs:
    cpa-plugin-key:
      enabled: true
      priority: 100

      # 可选：用于公开资源路由 (/v0/resource/plugins/cpa-plugin-key/usage) 查看全局报表的管理员 Token
      admin_token: "admin-secret-token-change-me"

      # -----------------------------------------------------------------------
      # 1. 存储与持久化配置
      # -----------------------------------------------------------------------
      storage:
        # 累计 Token 消耗与 USD 账单持久化文件路径（采用临时文件 + fsync + 原子重命名机制）
        usage_file: "./data/key_usage_stats.json"
        # 网页端动态增删改查的 API Key、路由规则与自定义模型单价持久化文件路径（修改后立即内存热生效）
        rules_file: "./data/key_guard_rules.json"
        # 定时落盘间隔（秒），同时在 plugin.shutdown / plugin.quiesce 时会自动触发刷盘
        flush_interval_seconds: 10
        # models.dev 远端参考价格本地离线缓存文件
        pricing_cache_file: "./data/models_dev.json"

      # -----------------------------------------------------------------------
      # 2. 模型定价同步与本地覆盖配置 (单位: USD / 1,000,000 Tokens)
      # 优先级: custom_prices (精确匹配 > 通配符匹配) > models.dev 实时/缓存价格 > default_price
      # -----------------------------------------------------------------------
      pricing:
        sync_url: "https://models.dev/api.json"
        sync_interval_hours: 24
        http_timeout_seconds: 30
        # 针对 OpenAI Chat Completions 流式请求自动注入 stream_options: {"include_usage": true}
        # （内置协议守卫：绝不注入到 claude / gemini / openai-response 等协议，避免上游 400 报错）
        auto_inject_include_usage: true

        # 可选：当模型既不在 custom_prices 也不在 models.dev 时使用的兜底单价（USD / 1M Tokens）
        default_price:
          input: 1.00
          output: 3.00
          cache_read: 0.10
          cache_write: 0.00

        # 本地手动覆盖价格（支持精确模型名及 * / ? 通配符）
        custom_prices:
          "gpt-4o":
            input: 2.50
            output: 10.00
            cache_read: 1.25
            cache_write: 0.00
          "claude-3-5-sonnet-*":
            input: 3.00
            output: 15.00
            cache_read: 0.30
            cache_write: 3.75
          "claude-3-7-sonnet-*":
            input: 3.00
            output: 15.00
            cache_read: 0.30
            cache_write: 3.75
          "my-private-model-*":
            input: 0.50
            output: 1.50
            cache_read: 0.05
            cache_write: 0.00

      # -----------------------------------------------------------------------
      # 3. 全局默认策略（未在下方 keys 列表中单独声明的 API Key 适用）
      # -----------------------------------------------------------------------
      default_policy:
        # true: 允许主配置 api-keys 中的其他 Key 按默认策略通过；false: 仅允许下方 keys 列表中的 Key
        allow_unlisted_keys: true
        # 默认最大并发数（0 表示不限制并发）
        max_concurrency: 0
        # 默认单 Key 累计金额配额上限（USD，0 表示不限额度）
        quota_limit_usd: 0
        # 默认允许访问的模型白名单
        allowed_models:
          - "*"

      # -----------------------------------------------------------------------
      # 4. 按 API Key 维度的精细化路由、并发限制、配额上限与凭证隔离策略
      # （也可直接在后台网页 /v0/resource/plugins/cpa-plugin-key/ui 可视化动态增删改查）
      # -----------------------------------------------------------------------
      keys:
        - api_key: "sk-tenant-alpha-prod"
          name: "租户 Alpha (生产环境)"
          enabled: true
          # 最大并发请求数（非流式在响应结束释放；SSE 流式在 [DONE] / 连接关闭 / context.Canceled 时释放）
          max_concurrency: 5
          # 累计消耗金额上限（USD，0 表示不限额；达到上限后自动拦截返回 429 insufficient_quota）
          quota_limit_usd: 50.00
          # 允许调用的模型白名单（支持精确匹配、* 通配符、以及 ! 前缀排除规则）
          allowed_models:
            - "claude-3-5-*"
            - "claude-3-7-*"
            - "gpt-4o*"
            - "!gpt-4o-audio-*"
          # 上游凭证绑定（实现多租户上游账号物理隔离）
          upstream_binding:
            # 绑定特定的上游 Auth ID、凭证文件名或凭证池前缀（支持 * 通配符）
            auth_ids:
              - "claude-alpha-*.json"
              - "openai-alpha-01"
            # 可选：限制允许路由的 Provider 类型
            providers:
              - "claude"
              - "openai"
            # 绑定池内负载均衡策略: "round-robin" (默认轮询) | "fill-first" (按优先级顺序)
            strategy: "round-robin"
            # true: 当绑定的专属凭证不可用/冷却时直接拒绝请求，严禁回退借用其他租户凭证
            strict: true

        - api_key: "sk-tenant-beta-dev"
          name: "租户 Beta (研发测试)"
          enabled: true
          max_concurrency: 2
          allowed_models:
            - "gpt-4o-mini"
            - "claude-3-5-haiku-*"
            - "gemini-2.5-flash*"
          upstream_binding:
            auth_ids:
              - "beta-pool-*"
            strategy: "fill-first"
            strict: true
