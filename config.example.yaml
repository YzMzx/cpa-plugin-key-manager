# =============================================================================
# CLIProxyAPI - cpa-plugin-key-manager 配置示例（v0.9.x）
#
# 把下面的 plugins 配置块合入 CLIProxyAPI 的 config.yaml 即可启用本插件。
#
# 只需要两项配置：是否启用、SQLite 数据库路径。
# API Key 规则、默认策略、模型价格覆盖、用量统计与账本全部存放在该 SQLite 数据库内，
# 请通过管理后台可视化配置，不要写进这个文件。
#
# ⚠️ Docker 部署必读：数据库目录必须挂载到宿主机，否则容器重建（docker compose
#    down / up --force-recreate）会把数据一起删掉。请在 docker-compose.yml 里加上：
#
#      services:
#        cli-proxy-api:
#          volumes:
#            - ./data:/CLIProxyAPI/data        # 对应默认数据库目录
#
#    如果自定义了 usage_db_file，请把该文件所在的目录挂载出来，并保证可读写。
# =============================================================================

plugins:
  enabled: true
  dir: ./plugins
  configs:
    cpa-plugin-key-manager:
      # 是否启用插件
      enabled: true

      storage:
        # SQLite 数据库文件（规则 + 用量 + 账本）
        # 留空表示使用默认路径：<CLIProxyAPI 根目录>/data/key_usage.db
        # （容器内即 /CLIProxyAPI/data/key_usage.db，记得按上面的说明挂载出来）
        # 也可用环境变量 CPA_KEY_MANAGER_USAGE_DB 覆盖
        usage_db_file: ""
        # 时区：总览图表的分桶与“今日/昨日/近7日”边界按此时区计算。
        # 默认 Asia/Shanghai（UTC+8），与浏览器/服务器时区无关。
        timezone: "Asia/Shanghai"  # UTC+8；可改为其他 IANA 如 "UTC"、"Asia/Tokyo"

      # 请求内容拦截默认关闭；请在管理页「请求拦截」配置。
      # 拦截设置/规则持久化到 SQLite rules_state.intercept，不从 YAML 读取凭据或规则。
      # 可选：新数据库的审计清理批次预算 seed；已有 SQLite 运行设置优先。
      # 这只限制每批工作量，不改变删除范围，热修改无需 ack_prune。
      audit:
        cleanup_batch_max_records: 1000  # 整数，范围 1..5000 条
        cleanup_batch_max_bytes: 33554432  # 字节整数，16 MiB..128 MiB，默认 32 MiB
        # 预览固定预算；执行时只允许降低，不允许超过预览预算。
