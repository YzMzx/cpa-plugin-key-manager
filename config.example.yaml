# =============================================================================
# CLIProxyAPI - cpa-plugin-key-manager 插件配置示例
# 将以下 plugins 配置块合入 CLIProxyAPI 的主配置文件 config.yaml 即可启用
# =============================================================================

plugins:
  enabled: true
  dir: ./plugins
  configs:
    cpa-plugin-key-manager:
      enabled: true
      priority: 100

      # 1. 存储与持久化配置
      storage:
        # 累计 Token 用量持久化文件路径（采用临时文件 + fsync + 原子重命名机制）
        usage_file: "./data/key_usage_stats.json"
        # 网页端动态增删改查的 API Key 与路由规则持久化文件路径（修改后立即内存热生效）
        rules_file: "./data/key_guard_rules.json"
        # 定时落盘间隔（秒），同时在 plugin.shutdown / plugin.quiesce 时会自动触发刷盘
        flush_interval_seconds: 10

      # 2. 全局默认策略（未单独设置专属规则的 CPA API Key 适用）
      default_policy:
        allow_unlisted_keys: true
        max_concurrency: 0
        allowed_models:
          - "*"
        upstream_binding:
          strategy: "round-robin"

      # 3. API Key 专属规则（自动与 CPA 全局 api-keys 同步，请在 CPA 管理后台「API Key 管控与用量」页面可视化配置）
      keys: []
